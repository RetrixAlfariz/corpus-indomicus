[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "corpus-indomicus"
version = "0.1.0"
description = "Finite, resumable acquisition and preservation toolkit for an Indonesian legal corpus."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Corpus Indomicus contributors" }]
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "httpx>=0.27,<1",
  "rich>=13.9,<15",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
corpus-indomicus = "corpus_indomicus.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/corpus_indomicus"]

[tool.pytest.ini_options]
testpaths = ["tests"]
